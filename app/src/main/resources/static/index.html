<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Role</title>
    <link rel="icon" type="image/png" href="assets/images/logo/logo.png" />
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="js/util.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/components/header.js" defer></script>
    <script src="js/components/footer.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>
            <main class="main-content">
                <h2>Select Your Role</h2>
                <p>Please choose your role in the Clinic Management System:</p>
                <div class="role-buttons">
                    <button id="adminBtn" class="role-btn admin-btn" onclick="selectRoleType('admin')">
                        <h3>Admin</h3>
                        <p>Manage doctors, patients, and system settings</p>
                    </button>
                    <button id="doctorBtn" class="role-btn doctor-btn" onclick="selectRoleType('doctor')">
                        <h3>Doctor</h3>
                        <p>View appointments and manage patient records</p>
                    </button>
                    <button id="patientBtn" class="role-btn patient-btn" onclick="selectRoleType('patient')">
                        <h3>Patient</h3>
                        <p>Book appointments and view medical records</p>
                    </button>
                </div>
            </main>
            <div id="footer"></div>
        </div>
    </div>

    <!-- Modal for login -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('adminLoginModal')">&times;</span>
            <h2>Admin Login</h2>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminUsername">Username:</label>
                    <input type="text" id="adminUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password:</label>
                    <input type="password" id="adminPassword" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- Doctor Login Modal -->
    <div id="doctorLoginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('doctorLoginModal')">&times;</span>
            <h2>Doctor Login</h2>
            <form id="doctorLoginForm">
                <div class="form-group">
                    <label for="doctorUsername">Username:</label>
                    <input type="text" id="doctorUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="doctorPassword">Password:</label>
                    <input type="password" id="doctorPassword" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- Patient Login Modal -->
    <div id="patientLoginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('patientLoginModal')">&times;</span>
            <h2>Patient Login</h2>
            <form id="patientLoginForm">
                <div class="form-group">
                    <label for="patientUsername">Username:</label>
                    <input type="text" id="patientUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="patientPassword">Password:</label>
                    <input type="password" id="patientPassword" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/services/index.js" defer></script>
    <script type="module" src="js/components/modals.js" defer></script>
    <script src="js/index.js" defer></script>
</body>
</html>
