<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/header.js}" defer></script>
    <script th:src="@{/js/footer.js}" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>
            <div class="main-content">
                <h2>My Appointments</h2>
                <div class="filters">
                    <input type="text" id="searchBar" placeholder="Search by patient name...">
                    <input type="date" id="datePicker">
                    <button id="todayButton">Today</button>
                </div>
                <table id="appointmentsTable">
                    <thead>
                        <tr>
                            <th>Patient Name</th>
                            <th>Date & Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTableBody"></tbody>
                </table>
            </div>
            <div id="footer"></div>
        </div>
    </div>

    <!-- Modal for viewing prescriptions -->
    <div id="prescriptionModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Patient Prescriptions</h2>
            <div id="prescriptionContent"></div>
        </div>
    </div>

    <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</body>
</html>
