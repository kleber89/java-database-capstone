<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/header.js}" defer></script>
    <script th:src="@{/js/footer.js}" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>
            <main class="main-content">
                <input type="text" id="searchBar" placeholder="Search doctors by name...">
                <select id="timeFilter">
                    <option value="">All Times</option>
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>
                <select id="specialtyFilter">
                    <option value="">All Specialties</option>
                    <option value="Cardiologist">Cardiologist</option>
                    <option value="Dentist">Dentist</option>
                    <option value="Dermatologist">Dermatologist</option>
                    <!-- Add more specialties as needed -->
                </select>
                <button id="addDoctorBtn">Add Doctor</button>
                <div id="content"></div>
            </main>
            <div id="footer"></div>
        </div>
    </div>

    <!-- Modal for adding doctor -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add New Doctor</h2>
            <form id="addDoctorForm">
                <label for="name">Name:</label>
                <input type="text" id="name" required><br>
                <label for="email">Email:</label>
                <input type="email" id="email" required><br>
                <label for="phone">Phone:</label>
                <input type="text" id="phone" required><br>
                <label for="password">Password:</label>
                <input type="password" id="password" required><br>
                <label for="specialty">Specialty:</label>
                <select id="specialty" required>
                    <option value="Cardiologist">Cardiologist</option>
                    <option value="Dentist">Dentist</option>
                    <option value="Dermatologist">Dermatologist</option>
                    <!-- Add more -->
                </select><br>
                <label for="availableTimes">Available Times:</label>
                <input type="text" id="availableTimes" placeholder="e.g., AM, PM" required><br>
                <button type="submit">Add Doctor</button>
            </form>
        </div>
    </div>

    <script type="module" th:src="@{/js/adminDashboard.js}" defer></script>
    <script type="module" th:src="@{/js/doctorCard.js}" defer></script>
</body>
</html>
